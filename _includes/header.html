<header class="site-header">
  <a class="brand" href="{{ '/' | relative_url }}" aria-label="Intern Year 首頁">
    <span class="brand-mark" aria-hidden="true">IY</span>
    <span>
      <strong>{{ site.title }}</strong>
      <small>{{ site.tagline }}</small>
    </span>
  </a>

  <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
    <span class="sr-only">開啟選單</span>
    <span></span><span></span>
  </button>

  <nav id="site-nav" class="site-nav" aria-label="主要導覽">
    <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a>
    <a href="{{ '/internship/' | relative_url }}"{% if page.url contains '/internship/' %} aria-current="page"{% endif %}>Internship Log</a>
    <a href="{{ '/notes/' | relative_url }}"{% if page.url contains '/notes/' %} aria-current="page"{% endif %}>Notes</a>
    <a href="{{ '/about/' | relative_url }}"{% if page.url contains '/about/' %} aria-current="page"{% endif %}>About</a>
  </nav>
</header>
